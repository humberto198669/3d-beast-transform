<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="referrer" content="no-referrer">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; style-src 'unsafe-inline'; script-src 'unsafe-inline'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'">
  <title>Cuenta confirmada | BeastMorph</title>
  <style>
    :root { color-scheme: dark; font-family: system-ui, sans-serif; }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px;
      background: linear-gradient(#06253f99, #04151ee8), url("../Assets/UI/MainMenu/background_menu.png.png") center/cover fixed;
      color: #f8fff4;
    }
    .card {
      width: min(420px, 100%); padding: 34px 27px; border-radius: 24px;
      border: 1px solid #78f7ba; background: #06171eee;
      box-shadow: 0 18px 55px #000b, inset 0 0 30px #29d88b29; text-align: center;
    }
    .gem {
      width: 86px; height: 106px; margin: 0 auto 18px;
      background: linear-gradient(135deg, #d5ffbd 0 12%, #35f36e 13% 48%, #087e43 49% 72%, #7dff91 73%);
      clip-path: polygon(50% 0, 88% 24%, 78% 78%, 50% 100%, 22% 78%, 12% 24%);
      filter: drop-shadow(0 0 19px #39ff75);
    }
    h1 { margin: 0 0 10px; color: #8cff72; font-size: 1.72rem; }
    p { margin: 0; color: #d6e4df; line-height: 1.5; }
    .success { margin-top: 18px; color: #9effae; font-weight: 800; }
    button {
      width: 100%; margin-top: 24px; padding: 13px 16px; border: 0; border-radius: 12px;
      color: #07140d; background: linear-gradient(#a7ff74, #42cf62);
      font-weight: 900; font-size: 1rem; cursor: pointer;
    }
    .hint { margin-top: 13px; color: #aabdb8; font-size: .88rem; }
    .error { color: #ff9a8f; }
  </style>
</head>
<body>
  <main class="card">
    <div class="gem" aria-hidden="true"></div>
    <h1 id="title">¡CUENTA CONFIRMADA!</h1>
    <p id="message">Tu correo fue verificado correctamente. Tu progreso ya puede guardarse y recuperarse con tu cuenta.</p>
    <p id="status" class="success">Regresa a BeastMorph e inicia sesión.</p>
    <button id="closeButton" type="button">VOLVER AL JUEGO</button>
    <p class="hint">Si esta ventana no se cierra automáticamente, ciérrala y vuelve a abrir BeastMorph.</p>
  </main>
  <script>
    (() => {
      'use strict';
      const params = new URLSearchParams(location.hash.slice(1));
      const query = new URLSearchParams(location.search);
      const error = params.get('error_description') || query.get('error_description');
      const isConfirmation = params.has('access_token') || params.get('type') === 'signup';

      // Los enlaces de confirmación pueden incluir una sesión temporal en el fragmento.
      // Se elimina inmediatamente para que no permanezca visible ni en el historial.
      history.replaceState(null, '', location.pathname);

      if (error) {
        document.getElementById('title').textContent = 'NO SE PUDO CONFIRMAR';
        document.getElementById('message').textContent = decodeURIComponent(error.replace(/\+/g, ' '));
        document.getElementById('status').textContent = 'Solicita un correo nuevo desde BeastMorph.';
        document.getElementById('status').className = 'error';
      } else if (!isConfirmation) {
        document.getElementById('title').textContent = 'ENLACE NO VÁLIDO';
        document.getElementById('message').textContent = 'Esta pantalla debe abrirse desde el enlace enviado por Supabase a tu correo.';
        document.getElementById('status').textContent = 'Crea una cuenta o solicita un correo nuevo desde BeastMorph.';
        document.getElementById('status').className = 'error';
      }

      document.getElementById('closeButton').addEventListener('click', () => {
        window.close();
        setTimeout(() => {
          document.getElementById('status').textContent = 'Ya puedes cerrar esta pestaña y regresar a BeastMorph.';
        }, 150);
      });
    })();
  </script>
</body>
</html>
