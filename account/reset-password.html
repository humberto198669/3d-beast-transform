<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="referrer" content="no-referrer">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; style-src 'unsafe-inline'; script-src 'unsafe-inline'; connect-src https://iawxlqnrleztkhiwyeli.supabase.co; base-uri 'none'; form-action 'none'; frame-ancestors 'none'">
  <title>Restablecer contraseña | BeastMorph</title>
  <style>
    :root { color-scheme: dark; font-family: system-ui, sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; background: linear-gradient(#06253f99, #04151edd), url("../Assets/UI/MainMenu/background_menu.png.png") center/cover fixed; color: #f8fff4; }
    .card { width: min(420px, 100%); padding: 30px 26px; border-radius: 24px; border: 1px solid #78f7ba; background: #06171ee8; box-shadow: 0 18px 55px #000b, inset 0 0 28px #29d88b22; text-align: center; }
    h1 { margin: 0 0 8px; color: #8cff72; font-size: 1.65rem; }
    p { margin: 0 0 22px; color: #d6e4df; line-height: 1.45; }
    label { display: block; margin: 15px 0 7px; text-align: left; font-weight: 700; }
    input { width: 100%; padding: 13px 14px; border: 1px solid #628279; border-radius: 12px; background: #102a31; color: white; font-size: 1rem; outline: none; }
    input:focus { border-color: #82ff79; box-shadow: 0 0 0 3px #63e77c30; }
    button, .back { width: 100%; display: block; margin-top: 20px; padding: 13px 16px; border: 0; border-radius: 12px; color: #07140d; background: linear-gradient(#a7ff74, #42cf62); font-weight: 900; font-size: 1rem; cursor: pointer; text-decoration: none; }
    button:disabled { opacity: .55; cursor: wait; }
    .back { background: #294047; color: white; }
    #message { min-height: 24px; margin: 16px 0 0; font-weight: 700; }
    .error { color: #ff988c; }
    .success { color: #8cff9f; }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <main class="card">
    <h1>NUEVA CONTRASEÑA</h1>
    <p>Crea una contraseña nueva para continuar tu aventura en BeastMorph.</p>
    <section id="formSection">
      <label for="password">Nueva contraseña</label>
      <input id="password" type="password" minlength="8" maxlength="128" autocomplete="new-password">
      <label for="confirm">Confirmar contraseña</label>
      <input id="confirm" type="password" minlength="8" maxlength="128" autocomplete="new-password">
      <button id="submit" type="button">GUARDAR CONTRASEÑA</button>
    </section>
    <p id="message" role="status" aria-live="polite"></p>
    <a id="back" class="back" href="../" hidden>VOLVER A BEASTMORPH</a>
  </main>
  <script>
    (() => {
      'use strict';
      const SUPABASE_URL = 'https://iawxlqnrleztkhiwyeli.supabase.co';
      const PUBLISHABLE_KEY = 'sb_publishable_C3JA5_9VGnYpu0JD_yxz5g_Ut2lddE-';
      const params = new URLSearchParams(location.hash.slice(1));
      const accessToken = params.get('access_token') || '';
      const recoveryType = params.get('type') || '';
      const errorDescription = params.get('error_description');
      const form = document.getElementById('formSection');
      const submit = document.getElementById('submit');
      const message = document.getElementById('message');
      const back = document.getElementById('back');
      history.replaceState(null, '', location.pathname + location.search);

      function show(text, error = false) {
        message.textContent = text;
        message.className = error ? 'error' : 'success';
      }

      if (errorDescription || !accessToken || (recoveryType && recoveryType !== 'recovery')) {
        form.hidden = true;
        back.hidden = false;
        show(errorDescription ? decodeURIComponent(errorDescription.replace(/\+/g, ' ')) : 'Este enlace no es válido o ya venció. Solicita uno nuevo desde BeastMorph.', true);
        return;
      }

      submit.addEventListener('click', async () => {
        const password = document.getElementById('password').value;
        const confirm = document.getElementById('confirm').value;
        if (password.length < 8) return show('La contraseña debe tener al menos 8 caracteres.', true);
        if (password !== confirm) return show('Las contraseñas no coinciden.', true);
        submit.disabled = true;
        show('Guardando…');
        try {
          const response = await fetch(`${SUPABASE_URL}/auth/v1/user`, {
            method: 'PUT',
            headers: { apikey: PUBLISHABLE_KEY, Authorization: `Bearer ${accessToken}`, 'Content-Type': 'application/json' },
            body: JSON.stringify({ password })
          });
          const data = await response.json().catch(() => ({}));
          if (!response.ok) throw new Error(data.msg || data.message || 'No se pudo actualizar la contraseña.');
          form.hidden = true;
          back.hidden = false;
          show('Contraseña actualizada. Ya puedes iniciar sesión en BeastMorph.');
        } catch (error) {
          show(error.message || 'El enlace venció. Solicita uno nuevo desde el juego.', true);
          submit.disabled = false;
        }
      });
    })();
  </script>
</body>
</html>
